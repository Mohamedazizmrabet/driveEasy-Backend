$kind: http-request
url: "{{gateway}}/api/vehicules/{{vehiculeId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 200", () => pm.response.to.have.status(200));
      const r = pm.response.json();
      pm.test("Bon véhicule", () => pm.expect(r.id).to.eql(Number(pm.collectionVariables.get("vehiculeId"))));
    language: text/javascript
order: 6000
