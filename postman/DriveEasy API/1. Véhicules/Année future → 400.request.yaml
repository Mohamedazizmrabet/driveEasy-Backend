$kind: http-request
url: "{{gateway}}/api/vehicules"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "immatriculation": "YY",
      "marque": "Dacia",
      "modele": "Sandero",
      "annee": 2099,
      "couleur": "Gris",
      "categorie": "ECONOMIQUE",
      "carburant": "ESSENCE",
      "boite": "MANUELLE",
      "nbPlaces": 5,
      "kilometrage": 1000,
      "prixJournalier": 100,
      "imageUrl": "https://placehold.co/600x400?text=Dacia+Sandero"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 400", () => pm.response.to.have.status(400));
      const r = pm.response.json();
      pm.test("Message : année", () => pm.expect(r.message).to.include("année"));
    language: text/javascript
order: 5000
