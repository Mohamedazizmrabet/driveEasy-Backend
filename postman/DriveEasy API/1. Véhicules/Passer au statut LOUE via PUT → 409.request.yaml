$kind: http-request
url: "{{gateway}}/api/vehicules/{{vehiculeId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "immatriculation": "{{immat}}",
      "marque": "Dacia",
      "modele": "Sandero",
      "annee": 2024,
      "couleur": "Gris",
      "categorie": "ECONOMIQUE",
      "carburant": "ESSENCE",
      "boite": "MANUELLE",
      "nbPlaces": 5,
      "kilometrage": 1000,
      "prixJournalier": 100,
      "imageUrl": "https://placehold.co/600x400?text=Dacia+Sandero",
      "statut": "LOUE"
    }
scripts:
  - type: afterResponse
    code: pm.test("Statut 409", () => pm.response.to.have.status(409));
    language: text/javascript
order: 9000
