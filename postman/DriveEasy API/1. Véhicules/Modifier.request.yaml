$kind: http-request
url: "{{gateway}}/api/vehicules/{{vehiculeId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "immatriculation": "{{immat}}",
      "marque": "Dacia",
      "modele": "Sandero",
      "annee": 2024,
      "couleur": "Bleu",
      "categorie": "ECONOMIQUE",
      "carburant": "ESSENCE",
      "boite": "MANUELLE",
      "nbPlaces": 5,
      "kilometrage": 1000,
      "prixJournalier": 100,
      "imageUrl": "https://placehold.co/600x400?text=Dacia+Sandero"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 200", () => pm.response.to.have.status(200));
      const r = pm.response.json();
      pm.test("Couleur modifiée", () => pm.expect(r.couleur).to.eql("Bleu"));
    language: text/javascript
order: 8000
