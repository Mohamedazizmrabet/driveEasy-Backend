$kind: http-request
url: "{{gateway}}/api/locations/{{locationId}}/depart"
method: PATCH
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 200", () => pm.response.to.have.status(200));
      const r = pm.response.json();
      pm.test("EN_COURS", () => pm.expect(r.statut).to.eql("EN_COURS"));
      pm.test("kmDepart = kilométrage du véhicule", () => pm.expect(r.kmDepart).to.eql(1000));
    language: text/javascript
order: 9000
