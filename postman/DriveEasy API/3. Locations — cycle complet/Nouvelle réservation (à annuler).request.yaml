$kind: http-request
url: "{{gateway}}/api/locations"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "clientId": "{{clientId}}",
      "vehiculeId": "{{vehiculeId}}",
      "dateDebut": "{{dateDebut2}}",
      "dateFin": "{{dateFin2}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 201", () => pm.response.to.have.status(201));
      const r = pm.response.json();
      pm.collectionVariables.set("locationId2", r.id);
    language: text/javascript
order: 16000
