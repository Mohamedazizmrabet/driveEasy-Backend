$kind: http-request
url: "{{gateway}}/api/vehicules/{{vehiculeId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 200", () => pm.response.to.have.status(200));
      const r = pm.response.json();
      pm.test("DISPONIBLE", () => pm.expect(r.statut).to.eql("DISPONIBLE"));
      pm.test("Kilométrage 1450", () => pm.expect(r.kilometrage).to.eql(1450));
    language: text/javascript
order: 14000
