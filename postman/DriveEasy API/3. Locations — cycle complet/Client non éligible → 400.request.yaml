$kind: http-request
url: "{{gateway}}/api/locations"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "clientId": 4,
      "vehiculeId": "{{vehiculeId}}",
      "dateDebut": "{{dateDebut}}",
      "dateFin": "{{dateFin}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 400", () => pm.response.to.have.status(400));
      const r = pm.response.json();
      pm.test("Message : non éligible", () => pm.expect(r.message).to.include("non éligible"));
    language: text/javascript
order: 3000
