$kind: http-request
url: "{{gateway}}/api/locations/{{locationId}}/retour"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "kmRetour": 1450,
      "dateRetour": "{{dateRetourRetard}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 200", () => pm.response.to.have.status(200));
      const r = pm.response.json();
      pm.test("TERMINEE", () => pm.expect(r.statut).to.eql("TERMINEE"));
      pm.test("Pénalité = 2 × 1,5 × 100 = 300", () => pm.expect(r.penalite).to.eql(300));
      pm.test("Total = 300 + 300", () => pm.expect(r.montantTotal).to.eql(600));
    language: text/javascript
order: 13000
