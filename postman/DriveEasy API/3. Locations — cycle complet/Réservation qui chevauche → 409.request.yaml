$kind: http-request
url: "{{gateway}}/api/locations"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "clientId": "{{clientId}}",
      "vehiculeId": "{{vehiculeId}}",
      "dateDebut": "{{dateChevauchement}}",
      "dateFin": "{{dateFinChevauchement}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 409", () => pm.response.to.have.status(409));
      const r = pm.response.json();
      pm.test("Message : déjà réservé", () => pm.expect(r.message).to.include("déjà réservé"));
    language: text/javascript
order: 6000
