$kind: http-request
url: "{{gateway}}/api/vehicules/{{vehiculeId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 200", () => pm.response.to.have.status(200));
      pm.test("LOUE", () => pm.expect(pm.response.json().statut).to.eql("LOUE"));
    language: text/javascript
order: 10000
