$kind: http-request
name: Retour avec km < départ → 400
url: "{{gateway}}/api/locations/{{locationId}}/retour"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "kmRetour": 500,
      "dateRetour": "{{dateRetourRetard}}"
    }
scripts:
  - type: afterResponse
    code: pm.test("Statut 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 12000
