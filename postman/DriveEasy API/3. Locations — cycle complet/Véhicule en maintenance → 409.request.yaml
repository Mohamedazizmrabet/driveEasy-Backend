$kind: http-request
url: "{{gateway}}/api/locations"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "clientId": "{{clientId}}",
      "vehiculeId": 7,
      "dateDebut": "{{dateDebut}}",
      "dateFin": "{{dateFin}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 409", () => pm.response.to.have.status(409));
      const r = pm.response.json();
      pm.test("Message : maintenance", () => pm.expect(r.message).to.include("maintenance"));
    language: text/javascript
order: 4000
