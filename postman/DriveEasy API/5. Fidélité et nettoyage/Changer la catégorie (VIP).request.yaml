$kind: http-request
url: "{{gateway}}/api/clients/{{clientId}}/categorie"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "categorieClient": "VIP"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 200", () => pm.response.to.have.status(200));
      pm.test("VIP", () => pm.expect(pm.response.json().categorieClient).to.eql("VIP"));
    language: text/javascript
order: 1000
