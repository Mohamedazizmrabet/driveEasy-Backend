$kind: http-request
name: "Éligibilité : client valide"
url: "{{gateway}}/api/clients/{{clientId}}/eligibilite"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 200", () => pm.response.to.have.status(200));
      pm.test("Éligible", () => pm.expect(pm.response.json().eligible).to.be.true);
    language: text/javascript
order: 5000
