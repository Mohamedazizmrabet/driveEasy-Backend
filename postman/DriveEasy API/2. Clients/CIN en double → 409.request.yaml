$kind: http-request
url: "{{gateway}}/api/clients"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "cin": "{{cin}}",
      "nom": "Postman",
      "prenom": "Test",
      "dateNaissance": "1995-05-20",
      "email": "autre@example.tn",
      "telephone": "+216 20 000 000",
      "adresse": "Tunis",
      "numeroPermis": "AUTRE",
      "dateExpirationPermis": "2035-01-01"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 409", () => pm.response.to.have.status(409));
      const r = pm.response.json();
      pm.test("Message : CIN", () => pm.expect(r.message).to.include("CIN"));
    language: text/javascript
order: 2000
