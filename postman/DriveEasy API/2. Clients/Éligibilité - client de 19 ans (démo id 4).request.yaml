$kind: http-request
name: "Éligibilité : client de 19 ans (démo id 4)"
url: "{{gateway}}/api/clients/4/eligibilite"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 200", () => pm.response.to.have.status(200));
      const r = pm.response.json();
      pm.test("Non éligible", () => pm.expect(r.eligible).to.be.false);
      pm.test("Motif âge", () => pm.expect(r.motifs.join()).to.include("Âge"));
    language: text/javascript
order: 6000
