$kind: http-request
url: "{{gateway}}/api/locations?statut=ANNULEE&clientId={{clientId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 200", () => pm.response.to.have.status(200));
      pm.test("Seulement ANNULEE", () => pm.response.json().content.forEach(l => pm.expect(l.statut).to.eql("ANNULEE")));
    language: text/javascript
order: 2000
