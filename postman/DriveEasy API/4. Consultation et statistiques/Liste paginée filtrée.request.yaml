$kind: http-request
url: "{{gateway}}/api/locations?clientId={{clientId}}&page=0&size=1"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 200", () => pm.response.to.have.status(200));
      const r = pm.response.json();
      pm.test("2 locations au total", () => pm.expect(r.totalElements).to.eql(2));
      pm.test("1 par page", () => { pm.expect(r.content).to.have.lengthOf(1); pm.expect(r.totalPages).to.eql(2); });
    language: text/javascript
order: 1000
