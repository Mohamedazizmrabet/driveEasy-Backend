server:
  port: 8081
spring:
  application:
    name: vehicule-service
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
info:
  app:
    name: vehicule-service
    description: Gestion du parc automobile, des catégories et de la disponibilité
# Propriétés métier
driveeasy:
  vehicule:
    annee-minimale: 1990
    donnees-demo: true
