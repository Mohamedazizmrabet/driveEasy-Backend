server:
  port: 8083
spring:
  application:
    name: location-service
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
info:
  app:
    name: location-service
    description: Cycle de vie des locations, tarification et statistiques
# Propriétés métier : tarification et fidélité
driveeasy:
  location:
    remise-fidele: 0.05
    remise-vip: 0.10
    coefficient-penalite: 1.5
    seuil-fidele: 5
    seuil-vip: 15
    taille-page-defaut: 10
    donnees-demo: true
    coefficients-categorie:
      ECONOMIQUE: 1.0
      COMPACTE: 1.0
      BERLINE: 1.1
      SUV: 1.2
      LUXE: 1.3
      UTILITAIRE: 1.1
