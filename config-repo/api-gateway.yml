server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: vehicule-service
          uri: lb://VEHICULE-SERVICE
          predicates:
            - Path=/api/vehicules/**
          filters:
            - StripPrefix=1
        - id: client-service
          uri: lb://CLIENT-SERVICE
          predicates:
            - Path=/api/clients/**
          filters:
            - StripPrefix=1
        - id: location-service
          uri: lb://LOCATION-SERVICE
          predicates:
            - Path=/api/locations/**
          filters:
            - StripPrefix=1
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: http://localhost:4200
            allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
            allowed-headers: '*'
            allow-credentials: true
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
